[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyzer"
version = "0.1.0"
description = "Detect brute force, scanning and web attacks in Linux auth logs and Apache/nginx access logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cristian Bora" }]
dependencies = []

[project.scripts]
loganalyzer = "loganalyzer.cli:main"

[tool.setuptools]
packages = ["loganalyzer"]
